# ==============================================================================
# Base Configuration (Shared settings across all environments)
# Environment files (development, staging, production, local) inherit from this.
# ==============================================================================

grpc {
  server {
    host = "0.0.0.0"
    host = ${?GRPC_HOST}

    port = 3030
    port = ${?GRPC_PORT}
  }
}

pekko {
  # Default logging level for Pekko
  loglevel = "INFO"
  loglevel = ${?LOG_LEVEL}

  # Enable HTTP/2 for gRPC cleartext (h2c) transport
  http {
    server {
      preview {
        enable-http2 = on
      }
    }
  }
}
